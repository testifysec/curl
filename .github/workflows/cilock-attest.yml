name: cilock-attest
# Supply-chain attestation + verification for TestifySec's certified curl.
# Drives cilock DIRECTLY (no third-party action) — installs a pinned,
# checksum-verified cilock, then signs keyless via the GitHub Actions OIDC
# identity (ambient workflow identity -> TestifySec platform Fulcio + RFC 3161
# TSA), stores evidence in Archivista, and GATES the build on `cilock verify`
# against the signed policy in .supply-chain/.
#
# The repo's Actions identity is federated to the tenant
# (`cilock trust github testifysec/curl`) — no long-lived secrets.

on:
  push:
    branches: [supply-chain]
    tags: ["curl-*", "v*"]
  workflow_dispatch: {}

permissions:
  id-token: write   # REQUIRED: GitHub OIDC token for keyless Fulcio signing
  contents: read

env:
  CILOCK_VERSION: "3.0.0"
  PLATFORM_URL: "https://platform.testifysec.com"

jobs:
  attest-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install the tool the safe way: pinned + checksum-gated before exec.
      - name: Install cilock (pinned, checksum-verified)
        run: |
          base="https://cilock.dev/dl/v${CILOCK_VERSION}"
          curl -fsSLO "${base}/cilock-${CILOCK_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "${base}/cilock-${CILOCK_VERSION}-linux-amd64.tar.gz.sha256"
          sha256sum -c "cilock-${CILOCK_VERSION}-linux-amd64.tar.gz.sha256"
          tar -xzf "cilock-${CILOCK_VERSION}-linux-amd64.tar.gz"
          sudo install cilock /usr/local/bin/cilock
          cilock version

      # SLSA L2+: source provenance, signed by this workflow's OIDC identity.
      - name: Attest source (step=source-git)
        run: |
          cilock run --step source-git \
            -a git,github,environment \
            -o source-git.att.json \
            --platform-url "${PLATFORM_URL}" --enable-archivista \
            -- git rev-parse HEAD

      - name: Install curl build deps
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool make

      # SLSA L2+: build provenance over the produced curl binary.
      - name: Attest build (step=build)
        run: |
          cilock run --step build \
            -a environment,git \
            -o build.att.json \
            --platform-url "${PLATFORM_URL}" --enable-archivista \
            -- bash -c '
              autoreconf -fi &&
              ./configure --without-ssl --without-libpsl --disable-docs --disable-manual &&
              make -j"$(nproc)"'

      # The GATE: fail the build if provenance doesn't satisfy the signed policy.
      # Offline verify: load both step envelopes directly. They carry the inline
      # v0.3 Merkle leaves, so cilock bridges ./src/curl's file digest to the
      # build product-tree root, and reaches source-git via the shared commit.
      # The policy embeds the platform-fulcio + platform-tsa roots, so no network
      # trust resolution is needed (--platform-url "").
      - name: Verify against signed supply-chain policy
        run: |
          cilock verify ./src/curl \
            --policy .supply-chain/testifysec-curl.policy.signed.json \
            --publickey .supply-chain/testifysec-curl-policy.pub \
            -a source-git.att.json -a build.att.json \
            --platform-url "" \
            --vsa-outfile curl-build.vsa.json
          echo "Supply-chain policy satisfied — curl build is certified."

      - name: Upload VSA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curl-build-vsa
          path: curl-build.vsa.json
          if-no-files-found: ignore
