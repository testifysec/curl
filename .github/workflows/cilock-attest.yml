name: cilock-attest
# Supply-chain attestation + verification for TestifySec's certified curl.
# Produces SLSA build-track provenance via cilock keyless workflow identity
# (Fulcio + RFC 3161 TSA), stores evidence in Archivista, then GATES on
# `cilock verify` against the signed policy committed in .supply-chain/.
#
# The repo's Actions identity is federated to the TestifySec tenant
# (`cilock trust github testifysec/curl`), so no long-lived secrets are needed.

on:
  push:
    branches: [supply-chain]
    tags: ["curl-*", "v*"]
  workflow_dispatch: {}

permissions:
  id-token: write   # REQUIRED: mint GitHub OIDC token for keyless Fulcio signing
  contents: read

jobs:
  attest-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- SLSA L2+: source provenance, signed by this workflow's identity ---
      - name: Attest source (step=source-git)
        uses: aflock-ai/cilock-action@v1
        with:
          step: source-git
          attestations: git github
          command: git rev-parse HEAD
          enable-archivista: "true"

      - name: Install curl build deps
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool make

      # --- SLSA L2+: build provenance over the produced curl binary ---
      - name: Attest build (step=build)
        uses: aflock-ai/cilock-action@v1
        with:
          step: build
          enable-archivista: "true"
          command: |
            autoreconf -fi
            ./configure --without-ssl --disable-docs --disable-manual
            make -j"$(nproc)"

      # --- Install the verifier itself the safe way: pinned + checksum-gated ---
      - name: Install cilock (pinned v3.0.0, checksum-verified)
        run: |
          VER=3.0.0
          base="https://cilock.dev/dl/v${VER}"
          curl -fsSLO "${base}/cilock-${VER}-linux-amd64.tar.gz"
          curl -fsSLO "${base}/cilock-${VER}-linux-amd64.tar.gz.sha256"
          sha256sum -c "cilock-${VER}-linux-amd64.tar.gz.sha256"
          tar -xzf "cilock-${VER}-linux-amd64.tar.gz"
          sudo install cilock /usr/local/bin/cilock

      # --- The GATE: fail the build if provenance doesn't satisfy the policy ---
      - name: Verify against signed supply-chain policy
        run: |
          cilock verify ./src/curl \
            --policy .supply-chain/testifysec-curl.policy.signed.json \
            --publickey .supply-chain/testifysec-curl-policy.pub \
            --enable-archivista \
            --vsa-outfile curl-build.vsa.json
          echo "Supply-chain policy satisfied — curl build is certified."

      - name: Upload VSA
        uses: actions/upload-artifact@v4
        with:
          name: curl-build-vsa
          path: curl-build.vsa.json
